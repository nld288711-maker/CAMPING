<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Camping Manager 3D</title>
<style>
:root{--p:#10b981;--bg:rgba(15,23,42,.94);--card:rgba(51,65,85,.7);--bd:rgba(255,255,255,.14);--tx:#f8fafc;--mu:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:'Segoe UI',system-ui,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;color:var(--tx)}
#cv{position:fixed;inset:0}
#cv canvas{display:block}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b1120;color:#fca5a5;padding:30px;text-align:center;z-index:99;font-size:15px}
#hud{position:fixed;top:10px;left:10px;right:10px;min-height:58px;background:var(--bg);border:1px solid var(--bd);border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;gap:10px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-size:13px}
.pill small{display:block;font-size:9px;color:var(--mu);text-transform:uppercase}
.pill b{font-variant-numeric:tabular-nums}
.sp button{background:transparent;border:0;color:var(--mu);padding:6px 9px;cursor:pointer;font-weight:700;border-radius:6px}
.sp button.on{background:var(--p);color:#fff}
#dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--bd);border-radius:14px;display:flex;gap:4px;padding:8px;z-index:10}
#dock button{background:transparent;border:0;color:var(--mu);min-width:70px;padding:6px;border-radius:10px;cursor:pointer;font-size:11px;font-weight:600}
#dock button span{display:block;font-size:20px}
#dock button:hover{background:var(--card);color:#fff}
#bar,#insp{position:fixed;background:var(--bg);border:1px solid var(--p);border-radius:12px;padding:10px 14px;z-index:12;display:none;font-size:13px}
#bar{bottom:100px;left:50%;transform:translateX(-50%);gap:12px;align-items:center}
#insp{bottom:100px;right:16px;width:275px;flex-direction:column;gap:8px}
.btn{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
.btn.s{background:var(--card);border:1px solid var(--bd)}.btn.r{background:#ef4444}
.btn:disabled{opacity:.4;cursor:not-allowed}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
#mod .c{width:900px;max-width:95vw;max-height:85vh;background:rgba(30,41,59,.98);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
#mod .h{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd);font-weight:700}
#mod .b{padding:18px 20px;overflow:auto}
.x{background:0;border:0;color:var(--mu);font-size:24px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.card:hover{border-color:var(--p)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pg{display:grid;grid-template-columns:repeat(7,70px);gap:6px;background:rgba(15,23,42,.8);padding:12px;border-radius:10px}
.t{height:62px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:2px dashed #60a5fa;background:rgba(59,130,246,.2)}
.t.own{border:2px solid #10b981;background:rgba(16,185,129,.3)}
.t.beach{background:rgba(250,204,21,.35);border-color:#facc15}
.t.sel{outline:3px solid #fff}
body.lobby #hud,body.lobby #dock,body.lobby #bar,body.lobby #insp,body.lobby #mod,body.lobby #toasts,body.lobby #alertb,body.lobby #exitp,body.lobby #start{display:none!important}body.lobby #cv{pointer-events:none}
.pnj #hud,.pnj #dock,.pnj #bar,.pnj #insp,.pnj #mod,.pnj #toasts{display:none!important}.pnj #exitp{display:block!important}#start{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:linear-gradient(rgba(11,17,32,.3),rgba(11,17,32,.85));text-align:center}#start h1{font-size:36px}#start .btn{font-size:16px;padding:14px 28px}
#toasts{position:fixed;top:78px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--bg);border-left:4px solid var(--p);padding:9px 14px;border-radius:6px;font-size:12px;max-width:300px}
.prog{height:8px;background:#0f172a;border-radius:4px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--p)}.ok{color:#34d399}.no{color:#f87171}.lock{opacity:.55}
#cv{touch-action:none}html,body{overscroll-behavior:none}#bplace{display:none}
.mob #hud{top:calc(6px + env(safe-area-inset-top,0px));left:6px;right:6px;padding:5px 8px;min-height:0;gap:5px;border-radius:10px}
.mob #hud>div{gap:5px!important;flex-wrap:wrap}.mob #hud>div:first-child>div:first-child{display:none}
.mob .pill{padding:3px 7px;font-size:11px;border-radius:8px}.mob .pill small{font-size:8px}.mob .sp button{padding:6px 10px;font-size:13px}
.mob #dock{left:0;right:0;bottom:0;transform:none;border-radius:14px 14px 0 0;overflow-x:auto;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.mob #dock button{flex:0 0 auto;min-width:62px;padding:6px 4px;font-size:10px}.mob #dock button span{font-size:22px}
.mob #bar{left:6px;right:6px;width:auto;transform:none;bottom:calc(76px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;justify-content:center;gap:6px;padding:8px}
.mob #bar .btn{flex:1 1 auto;padding:11px 10px;font-size:13px}.mob #bplace{display:inline-block}
.mob #insp{left:6px;right:6px;width:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-height:46vh;overflow:auto;padding:10px}
.mob .btn{padding:10px 14px;font-size:13px}.mob .x{font-size:32px;padding:0 8px}
.mob #mod{align-items:flex-end}.mob #mod .c{width:100vw;max-width:100vw;max-height:90vh;border-radius:16px 16px 0 0}
.mob #mod .h{padding:10px 14px}.mob #mod .b{padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.mob .grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.mob .card{padding:9px}
.mob .pg{grid-template-columns:repeat(7,1fr);padding:6px;gap:3px}.mob .t{height:44px;font-size:8px}
.mob .tabs{flex-wrap:nowrap;overflow-x:auto}.mob .tabs>*{flex:0 0 auto}
.mob #toasts{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:6px;right:6px;align-items:center}.mob .toast{max-width:92vw}
.mob #start h1{font-size:26px}.mob #exitp{top:8px}
#alertb{position:fixed;top:78px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:10px;font-weight:800;font-size:14px;z-index:14;display:none;letter-spacing:.5px;color:#fff;box-shadow:0 0 18px rgba(0,0,0,.4);white-space:nowrap}#alertb.storm{background:linear-gradient(135deg,#dc2626,#7f1d1d);animation:pls 1s infinite}#alertb.hot{background:linear-gradient(135deg,#f97316,#b45309)}@keyframes pls{50%{box-shadow:0 0 30px #ef4444}}.pnj #alertb{display:none!important}.mob #alertb{top:calc(100px + env(safe-area-inset-top,0px));font-size:11px;padding:5px 10px;white-space:normal;text-align:center;max-width:94vw}

/* ===== STYLE V2 : chaleureux, crème, arrondi ===== */
:root{--p:#4cc04a;--bg:rgba(255,247,226,.97);--card:#fffdf5;--bd:#ecd9ad;--tx:#5b4630;--mu:#9a8264;--sh:0 3px 0 rgba(173,138,70,.3),0 7px 16px rgba(80,55,20,.2)}

#dock button{display:flex;align-items:center;gap:7px;text-align:left;min-width:0;background:linear-gradient(#fffdf3,#fbeccb);border:2px solid #ecd9ad;border-radius:16px;box-shadow:var(--sh);color:var(--tx);font-size:12.5px;font-weight:800;padding:4px 9px 4px 4px;transition:transform .12s}

.mob #dock{background:var(--bg);border:0;border-top:3px solid #ecd9ad;border-radius:18px 18px 0 0;box-shadow:0 -4px 12px rgba(80,55,20,.2)}
.mob #dock button{display:block;text-align:center;font-size:10px;box-shadow:none;padding:4px}.mob #dock button span{margin:0 auto 1px}
.mob #dock button[data-m=build]{order:-1;padding:4px 10px}
.btn{background:linear-gradient(#7fdc62,#3fae38);border:0;border-bottom:3px solid #2c8a28;border-radius:14px;padding:7px 12px;font-weight:800;color:#fff;box-shadow:0 3px 6px rgba(0,0,0,.16);transition:transform .1s}
.btn:active{transform:translateY(2px)}

.btn.y{background:linear-gradient(#ffd75a,#f5b51f);border-bottom:3px solid #c98c0b;color:#6b4a14}
.btn.big{width:100%;padding:11px;font-size:15px;margin-bottom:10px}

#mod{background:transparent!important;pointer-events:none;align-items:flex-start!important;justify-content:flex-start!important}
#mod .c{pointer-events:auto;margin:58px 0 0 146px;width:min(540px,calc(100vw - 170px));max-height:calc(100vh - 76px);background:var(--bg);border:3px solid #ecd9ad;border-radius:24px;box-shadow:0 8px 0 rgba(173,138,70,.25),0 14px 30px rgba(80,55,20,.3);animation:pop .22s ease-out}

#mod .b{padding:10px 12px}
.x{color:#c24e17;background:#ffdcc4;border-radius:50%;width:28px;height:28px;font-size:18px;line-height:26px;text-align:center;padding:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:#fffdf5;border:2px solid #f0e0b8;border-radius:14px;padding:9px;box-shadow:0 2px 0 rgba(173,138,70,.18)}.card:hover{border-color:#58b947}
.pg{background:#f6e8c4}.t{border-color:#6bb6e6;background:rgba(107,182,230,.25)}
.prog{background:#ecdcb4;border-radius:6px}.prog i{border-radius:6px}

[style*="#34d399"],[style*="#4ade80"]{color:#2f9e3a!important}[style*="#f87171"]{color:#e0452f!important}[style*="#7dd3fc"]{color:#1d8ac4!important}[style*="#fde047"],[style*="#fbbf24"]{color:#b8860b!important}[style*="#cbd5e1"]{color:var(--mu)!important}
#bar{background:var(--bg);border:3px solid #ecd9ad;border-radius:20px;box-shadow:var(--sh);color:var(--tx)}

.ih{display:flex;gap:8px;align-items:center;margin-bottom:6px}

:root{--cr:linear-gradient(#fffefa,#fbf1d8);--sh3:0 4px 0 rgba(181,146,78,.3),0 10px 20px rgba(60,40,10,.22),inset 0 2px 0 rgba(255,255,255,.95);--gr:linear-gradient(#97e56f,#55c441 50%,#3fae33 52%,#4cbc3d)}

function stats(){
  const has=S.staff.rec>0&&S.buildings.some(b=>b.t==='reception');
  const occ=S.buildings.filter(b=>def(b.t).acc&&b.st==='occ');
  const persons=occ.reduce((a,b)=>a+((b.fam&&b.fam.n)||3),0),rn=S.buildings.filter(b=>RESTO.includes(b.t)&&b.t!=='restaurant'&&b.cn!==false&&!uOff(b)).length,inc=occ.reduce((a,b)=>a+payOf(b),0)+Math.min(rn,S.staff.wait||0,S.staff.cook||0)*Math.min(220,persons*3);
  const sal=S.staff.rec*40+S.staff.clean*35+S.staff.mech*50+(S.staff.wait||0)*38+(S.staff.cook||0)*55+(S.staff.gard||0)*36+(S.staff.ent||0)*42+(S.staff.anim||0)*60;
  const exp=S.buildings.reduce((a,b)=>a+def(b.t).up,0)+Math.round(S.debt/30)+sal;
  return {inc:Math.round(inc),exp:Math.round(exp),stars:Math.max(1,starLevel()),people:persons,has:has};
}

const people=[];

const FAMLN=['Dubois','Martin','Bernard','Petit','Robert','Durand','Moreau','Laurent','Simon','Michel','Garcia','Roux','Lefebvre','Fontaine','Girard','Lambert'],MAXP=80;
function newFam(){const n=1+Math.floor(Math.random()*5);let ad,kids;
  if(n===1){ad=1;kids=0;}else if(n===2){if(Math.random()<.3){ad=1;kids=1;}else{ad=2;kids=0;}}else{ad=Math.random()<.2?1:2;kids=n-ad;}
  return {n:n,ad:ad,kids:kids,ln:FAMLN[Math.floor(Math.random()*FAMLN.length)],sp:0,mt:0};}
function famTxt(b){return b.fam?' • '+b.fam.n+' pers.':'';}
function nearestReach(x,z){let bi=-1,bd=1e9;for(const i of reach){const d=(NODES[i][0]-x)*(NODES[i][0]-x)+(NODES[i][1]-z)*(NODES[i][1]-z);if(d<bd){bd=d;bi=i;}}return bi;}
function famSpawn(b,f,idx){
  const kind=idx<f.ad?(Math.random()<.2?'senior':'adult'):(Math.random()<.55?'kid':'teen');
  const h=mkHuman(undefined,undefined,kind),fr=front(b,1),nd=reach.length?nearestReach(fr.x,fr.z):-1;

  scene.add(h);const sib=people.find(q=>q.fam===f);
  people.push({m:h,node:nd,route:[],sp:sib?sib.sp:1.5+Math.random(),hide:0,enter:null,shelter:rainOn&&Math.random()<.8,shelt:false,fam:f,bk:b,fk:kind,gi:idx<f.ad?((f.kids===0&&idx===1)?1:0):1});}

function famLeader(p){const f=p.fam;return people.find(q=>q.fam===f&&q.m.parent&&(f.sp?q.gi===p.gi:true))||p;}
let _fsync=0;
function famTick(dt){
  const d=dt*Math.max(1,S.speed);_fsync+=dt;if(_fsync>3){_fsync=0;syncPeople();}
  S.buildings.forEach(b=>{const f=b.fam;if(!f||b.st!=='occ'||f.n<2)return;
    f.mt=(f.mt||0)-d;if(f.mt>0)return;
    const was=f.sp;f.sp=Math.random()<.5?1:0;f.mt=25+Math.random()*35; // 1 chance sur 2 de rester/passer ensemble ou séparés à chaque période
    if(f.sp!==was)people.forEach(q=>{if(q.fam!==f)return;q.dest=null;q.done=null;if(!q.act&&!(q.hide>0)&&!q.shelt){q.route=[];q.enter=null;}});});
}
function spawnPeople(n){
  for(let i=0;i<n;i++){
    const h=mkHuman(),nd=reach.length?reach[Math.floor(Math.random()*reach.length)]:-1;
    if(nd>=0)h.position.set(NODES[nd][0],0,NODES[nd][1]);else h.position.set(EX+(Math.random()-.5)*6,0,-12);
    scene.add(h);people.push({m:h,node:nd,route:[],sp:1.5+Math.random(),hide:0,enter:null,shelter:rainOn&&Math.random()<.8,shelt:false});
  }
}
function nearestNode(x,z){let bi=-1,bd=1e9;for(let i=0;i<NODES.length;i++){const d=(NODES[i][0]-x)*(NODES[i][0]-x)+(NODES[i][1]-z)*(NODES[i][1]-z);if(d<bd){bd=d;bi=i;}}return bi;}

  if(!NODES.length||p.node<0||p.node>=NODES.length){p.route=[];return;}

    if(ld!==p){if(!ld.dest||p.done===ld.dest){p.route=[];return;}
      p.done=ld.dest;p.dest=ld.dest;p.enter=ld.dest.enter;const r2=route(p.node,ld.dest.node);p.route=r2||[];if(!r2)p.enter=null;return;}}
  const cons=S.buildings.filter(b=>b.cn!==false&&!uOff(b)&&['pool','restaurant','pizzeria','creperie','grocery','sanitary','tennis','slide','playground','paillote','foot','pedcab'].includes(b.t)&&!(b.t==='pedcab'&&!pedFree(b))&&!(b.t==='slide'&&b.br)&&!((b.t==='pool'||b.t==='slide')&&(b.iq<12||b.il<15))&&!(RESTO.includes(b.t)&&!restoOk()));

  if(!l.length){p.m.visible=false;p.hide=9999;return;}
  const b=(p.bk&&S.buildings.includes(p.bk))?p.bk:l[Math.floor(Math.random()*l.length)],f=front(b,1),r=route(p.node,nearestNode(f.x,f.z));p.enter=b;p.route=r||[];}

}

  o.querySelectorAll('select').forEach(s=>s.onchange=()=>{b.sched[+s.dataset.d]=+s.value;save();play(700,.08);});
  o.querySelector('#sti').onclick=()=>{o.remove();STBY=1;openInsp(b);STBY=0;};}
function animSync(){const n=S.staff.anim||0;while(ANIMS.length<n){const m=mkHuman(0xd946ef,'anim');m.position.set(EX-4+Math.random()*4,0,-17);scene.add(m);ANIMS.push({m:m});}while(ANIMS.length>n)scene.remove(ANIMS.pop().m);}
function stLimbs(u,a,b2,c,d2){u.l.rotation.x=a;u.r.rotation.x=b2;u.la.rotation.x=c;u.ra.rotation.x=d2;}
function stageFrame(dt,t){
  STB=S.buildings.find(b=>b.t==='stage'&&meshes.get(b.id))||null;const si=STB?stageOn(STB):-1;ACTST=si>=0?STB:null;
  if(ACTST&&STPREV!==ACTST){toast('🎤 Spectacle ce soir : '+SHOWS[si]+' ! Les vacanciers arrivent devant la scène.');}STPREV=ACTST;
  if(STB)stMusic(Math.hypot(target.x-STB.x,target.z-STB.z),si);else if(STM)STM.g.gain.value=0;
  ANIMS.forEach((a,i)=>{const m=a.m,u=m.userData,p=m.position;let tx=EX,tz=-17,ty=0,fy=0,sing=false;
    if(STB){const n=ANIMS.length,q=bLoc(STB,ACTST?(i-(n-1)/2)*4:-12+i*1.8,ACTST?-1:11.5);tx=q[0];tz=q[1];ty=bY(STB)+(ACTST?1.2:0);fy=(STB.rot||0);sing=!!ACTST;}
    const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
    if(d>.4){const k=Math.min(1,5*dt/d);p.x+=dx*k;p.z+=dz*k;p.y=ty;m.rotation.y=Math.atan2(dx,dz);stLimbs(u,Math.sin(t*10)*.5,-Math.sin(t*10)*.5,-Math.sin(t*10)*.4,Math.sin(t*10)*.4);}
    else{p.y=ty+(sing?Math.abs(Math.sin(t*6+i))*.2:0);m.rotation.y=fy;if(sing)stLimbs(u,Math.sin(t*6)*.4,-Math.sin(t*6)*.4,-2.5+Math.sin(t*6)*.5,-2.5-Math.sin(t*6)*.5);else stLimbs(u,0,0,0,0);}});
}
function stDance(p,dt,t){
  const b=ACTST,d=p.dn,u=p.m.userData,P=p.m.position;
  if(!d){if(!b||p.act||p.hide>0||p.shelt||!p.m.visible||Math.random()>dt*.2||people.filter(q=>q.dn).length>=45)return false;
    const fr=front(b,1),nd=reach.length?nearestReach(fr.x,fr.z):-1;if(nd<0||Math.hypot(NODES[nd][0]-fr.x,NODES[nd][1]-fr.z)>30)return false;
    const r=route(p.node,nd);if(!r)return false;p.route=r;p.enter=null;p.dn={ph:0,nd:nd,b:b,lx:RNx(-12,12),lz:RNx(13,25),y:P.y};return true;}
  if(!b&&d.ph<3){d.ph=3;}
  const go=(tx,tz,sp)=>{const dx=tx-P.x,dz=tz-P.z,L=Math.hypot(dx,dz);if(L<.5)return true;const k=Math.min(1,sp*dt*Math.max(1,S.speed)/L);P.x+=dx*k;P.z+=dz*k;P.y=d.y;p.m.rotation.y=Math.atan2(dx,dz);stLimbs(u,Math.sin(t*10)*.5,-Math.sin(t*10)*.5,-Math.sin(t*10)*.4,Math.sin(t*10)*.4);return false;};
  if(d.ph===0){if(!p.route.length)d.ph=1;else{const n=NODES[p.route[0]];if(!n){p.route=[];d.ph=1;return true;}if(go(n[0],n[1],p.sp))p.node=p.route.shift();return true;}}
  if(d.ph===1){const q=bLoc(d.b,d.lx,d.lz);if(go(q[0],q[1],p.sp))d.ph=2;return true;}
  if(d.ph===2){const ph=t*7+p.sp*3;P.y=d.y+Math.abs(Math.sin(ph))*.18;p.m.rotation.y=Math.atan2(d.b.x-P.x,d.b.z-P.z);stLimbs(u,Math.sin(ph)*.4,-Math.sin(ph)*.4,-2.4+Math.sin(ph)*.5,-2.4-Math.sin(ph)*.5);return true;}
  const n=NODES[d.nd];if(!n||go(n[0],n[1],p.sp*1.2)){p.node=d.nd;p.route=[];p.dn=null;stLimbs(u,0,0,0,0);}return true;
}
function stMusic(dist,si){if(!ac)return;if(!STM){STM={g:ac.createGain(),n:0,last:0};STM.g.gain.value=0;STM.g.connect(master||ac.destination);}
  const v=Math.max(0,1-dist/90)*(si>=0?.9:.3);STM.g.gain.setTargetAtTime(v,ac.currentTime,.3);if(v<.02)return;
  const bpm=108+(Math.max(0,si)*7)%36,st=30/bpm,now=ac.currentTime;if(now-STM.last<st)return;STM.last=now;const n=STM.n++%16,tt=now+.02,sc=[0,3,7,10,12,15,19];
  const osc=(type,f,dur,vol,f2)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,tt);if(f2)o.frequency.exponentialRampToValueAtTime(f2,tt+dur*.75);g.gain.setValueAtTime(vol,tt);g.gain.exponentialRampToValueAtTime(.001,tt+dur);o.connect(g);g.connect(STM.g);o.start(tt);o.stop(tt+dur+.02);};
  if(n%4===0)osc('sine',150,.22,.9,40);if(n%2===0)osc('square',55*Math.pow(2,sc[(n>>1)%4]/12),st*1.8,.18);
  osc('sawtooth',220*Math.pow(2,sc[(n*3+Math.max(0,si))%7]/12),st*.9,.05);if(n%4===2)osc('square',6000,.04,.04);}
syncPeople();refreshHUD();camClampOn=true;animSync();animate();
if(spectate){window.CampingCloud.showLobby();cine.cap='';}
else if(window.CampingCloud&&window.CampingCloud.mode&&window.CampingCloud.mode()==='play')skyDrop();   // « Jouer » depuis le salon : on arrive directement du ciel
if(!spectate&&!localStorage.getItem(SAVE+'_tip'))toast('Bienvenue ! Relie chaque bâtiment à un chemin piéton (sinon il reste inactif). Recherches (🔬) pour débloquer la suite. G = grille 1 m, N = réseaux eau/électricité.');
}
