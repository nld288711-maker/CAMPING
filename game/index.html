html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;color:var(--tx)}

#dock button:hover{background:var(--card);color:#fff}
#bar,#insp{position:fixed;background:var(--bg);border:1px solid var(--p);border-radius:12px;padding:10px 14px;z-index:12;display:none;font-size:13px}

/* ---------- Chargement de Three.js avec secours ---------- */
function loadThree(urls,done){
  if(window.THREE) return done();
  if(!urls.length) return showErr("Impossible de charger Three.js. Vérifiez votre connexion internet.");
  var s=document.createElement('script');s.src=urls[0];
  s.onload=function(){window.THREE?done():loadThree(urls.slice(1),done)};
  s.onerror=function(){loadThree(urls.slice(1),done)};
  document.head.appendChild(s);
}

function stats(){
  const has=S.staff.rec>0&&S.buildings.some(b=>b.t==='reception');
  const occ=S.buildings.filter(b=>def(b.t).acc&&b.st==='occ');
  const rn=S.buildings.filter(b=>RESTO.includes(b.t)&&b.cn!==false&&!uOff(b)).length,inc=occ.reduce((a,b)=>a+payOf(b),0)+Math.min(rn,S.staff.wait||0,S.staff.cook||0)*Math.min(220,occ.length*9);
  const sal=S.staff.rec*40+S.staff.clean*35+S.staff.mech*50+(S.staff.wait||0)*38+(S.staff.cook||0)*55+(S.staff.gard||0)*36+(S.staff.ent||0)*42;
  const exp=S.buildings.reduce((a,b)=>a+def(b.t).up,0)+Math.round(S.debt/30)+sal;
  return {inc:Math.round(inc),exp:Math.round(exp),stars:Math.max(1,starLevel()),people:occ.length*3,has:has};
}

  if(mats[0x06b6d4])mats[0x06b6d4].color.setHSL(.52,.85,.42+.06*Math.sin(t*2));
  const sp=sea.geometry.attributes.position;for(let i=0;i<sp.count;i++)sp.setY(i,Math.sin(sp.getX(i)*.06+t*1.6)*.07+Math.cos(sp.getZ(i)*.09+t*1.1)*.05);sp.needsUpdate=true;
  clouds.forEach(c=>{c.position.x+=dt*2;if(c.position.x>300)c.position.x=-300;});
  gulls.forEach(g=>{const u=g.userData;u.a+=dt*.4;g.position.set(Math.cos(u.a)*u.r,u.h,300+Math.sin(u.a)*u.r*.5);g.rotation.y=-u.a;u.w1.rotation.z=Math.sin(t*9)*.5;u.w2.rotation.z=-Math.sin(t*9)*.5;});
  acc+=dt;if(acc>.25){refreshHUD();if(selB&&$('insp').style.display==='flex')inspX();acc=0;}
  renderRefl();renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
/* ---------- SALON D'ACCUEIL : caméra de cinéma + tempêtes de simulation ---------- */
const cine={t:0,shot:null,from:null,last:'',stormIn:24,cap:'',n:0,bd:3.2,filmed:null};
function cineCap(t){if(t!==cine.cap){cine.cap=t;if(window.CampingCloud&&window.CampingCloud.caption)window.CampingCloud.caption(t);}}
function cineFalling(){return treeList.find(g=>g.parent&&g.userData.fall&&!g.userData.dead);}
function cineShot(){
  const R=(a,b)=>a+Math.random()*(b-a),dir=Math.random()<.5?-1:1,opts=[],add=(k,w,f)=>{if(k!==cine.last)opts.push({k:k,w:w,f:f});};
  const acc=[],misc=[];
  meshes.forEach(m=>{const b=m.userData&&m.userData.b,d=b&&def(b.t);if(!d||b.cn===false)return;if(d.acc)acc.push(m);else if(d.c==='Services'||d.c==='Loisirs'||d.c==='Plage')misc.push(m);});
  const mov=cars.filter(c=>c.m&&c.m.parent&&c.state!=='parked'&&c.state!=='wait'&&c.m.position.z>-95),
    ppl=people.filter(p=>p.m.visible&&p.m.parent&&p.route&&p.route.length),
    trees=treeList.filter(g=>g.parent&&!g.userData.dead&&!g.userData.fallen&&Math.hypot(g.position.x-EX,g.position.z-20)<140),fall=cineFalling();
  if(fall&&cine.filmed!==fall){cine.filmed=fall;cine.last='fall';const th0=R(0,6.28),dir2=dir;
    return {k:'fall',dur:8,cap:'Un arbre tombe dans la tempête !',alive:()=>!!fall.parent,pose:t=>({x:fall.position.x,y:3,z:fall.position.z,r:19,phi:1.25,th:th0+dir2*.15*t})};}
  if(acc.length)add('acc',3.2,()=>{const m=acc[Math.random()*acc.length|0],b=m.userData.b,d=def(b.t),h=R(1.3,2.4),r0=R(11,16)+(b.t==='chalet'||b.t==='lodge'?5:0),th0=R(0,6.28),dth=dir*R(.35,.8),ph=R(1.12,1.34),dur=R(7,10);
    return {k:'acc',dur:dur,cap:'Gros plan : '+d.n,pose:t=>({x:m.position.x,y:h,z:m.position.z,r:r0-3*t/dur,phi:ph,th:th0+dth*t/dur})};});
  if(mov.length)add('car',3,()=>{const c=mov[Math.random()*mov.length|0],r0=R(8,13),th0=R(0,6.28),dth=dir*R(.12,.3),ph=R(1.1,1.3),dur=R(8,12);
    return {k:'car',dur:dur,cap:'Des vacanciers arrivent au camping',alive:()=>!!c.m.parent&&cars.indexOf(c)>=0,pose:t=>({x:c.m.position.x,y:1.1,z:c.m.position.z,r:r0,phi:ph,th:th0+dth*t})};});
  if(ppl.length)add('ppl',2,()=>{const q=ppl[Math.random()*ppl.length|0],r0=R(6,9),th0=R(0,6.28),dth=dir*R(.1,.25),ph=R(1.15,1.32),dur=R(7,10);
    return {k:'ppl',dur:dur,cap:'La vie au camping',alive:()=>!!q.m.parent&&q.m.visible,pose:t=>({x:q.m.position.x,y:1.3,z:q.m.position.z,r:r0,phi:ph,th:th0+dth*t})};});
  if(misc.length)add('misc',1.6,()=>{const m=misc[Math.random()*misc.length|0],d=def(m.userData.b.t),r0=Math.max(d.w||6,d.d||6)*1.25+R(6,9),th0=R(0,6.28),dth=dir*R(.3,.6),ph=R(1.05,1.25),dur=R(7,9);
    return {k:'misc',dur:dur,cap:d.n,pose:t=>({x:m.position.x,y:2,z:m.position.z,r:r0,phi:ph,th:th0+dth*t/dur})};});
  if(storm&&trees.length)add('tree',3.5,()=>{const g=trees[Math.random()*trees.length|0],u=g.userData,y=Math.min(6,(u.h||6)*.5),r0=R(14,20),th0=R(0,6.28),dth=dir*R(.3,.6),ph=R(1.32,1.48),dur=R(7,9);
    return {k:'tree',dur:dur,cap:'Les arbres plient sous le vent',alive:()=>!!g.parent,pose:t=>({x:g.position.x,y:y,z:g.position.z,r:r0,phi:ph,th:th0+dth*t/dur})};});
  add('gate',1.1,()=>{const th0=R(0,6.28),dth=dir*R(.2,.45),ph=R(1.15,1.3),dur=R(8,10);
    return {k:'gate',dur:dur,cap:"L'entrée du camping",pose:t=>({x:EX,y:1.4,z:-28,r:24,phi:ph,th:th0+dth*t/dur})};});
  add('wide',1,()=>{const o=S.parcels.filter(q=>q.owned);let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;o.forEach(q=>{x0=Math.min(x0,q.minX);x1=Math.max(x1,q.maxX);z0=Math.min(z0,q.minZ);z1=Math.max(z1,q.maxZ);});if(!o.length){x0=-20;x1=20;z0=-20;z1=20;}
    const cx=(x0+x1)/2,cz=(z0+z1)/2,r0=Math.min(240,Math.max(70,Math.max(x1-x0,z1-z0)*1.1+25)),th0=R(0,6.28),dth=dir*R(.4,.7),dur=R(11,14),ph=R(.8,1.05);
    return {k:'wide',dur:dur,cap:"Vue d'ensemble du camping",pose:t=>({x:cx,y:0,z:cz,r:r0*(1-.12*t/dur),phi:ph,th:th0+dth*t/dur})};});
  let tot=0;opts.forEach(o=>tot+=o.w);let x=Math.random()*tot,pk=opts[0];for(const o of opts){x-=o.w;if(x<=0){pk=o;break;}}
  cine.last=pk.k;return pk.f();}
function cineTick(dt){
  meshes.forEach(m=>{const u=m.userData;if(u.badge)u.badge.visible=false;if(u.nc)u.nc.visible=false;if(u.wi)u.wi.visible=false;if(u.ei)u.ei.visible=false;if(u.ci)u.ci.visible=false;if(u.dr)u.dr.visible=false;});   // pas de pastilles de gestion dans le décor
  cine.stormIn-=dt;if(!storm&&cine.stormIn<=0){startStorm();cine.stormIn=105+Math.random()*75;}   // une tempête de temps en temps
  cine.t+=dt;const f=storm?cineFalling():null;
  if(!cine.shot||cine.t>=cine.shot.dur||(cine.shot.alive&&!cine.shot.alive())||(f&&cine.filmed!==f&&cine.shot.k!=='fall')){
    cine.from={x:target.x,y:target.y,z:target.z,r:radius,phi:phi,th:theta};cine.shot=cineShot();cine.t=0;cine.bd=cine.n++===0?3.2:1.8;}
  const P=cine.shot.pose(cine.t),F=cine.from;let b=Math.min(1,cine.t/cine.bd);b=b*b*(3-2*b);   // fondu de caméra entre deux plans
  if(F&&b<1){let d=P.th-F.th;d-=Math.round(d/(2*Math.PI))*2*Math.PI;P.x=F.x+(P.x-F.x)*b;P.y=F.y+(P.y-F.y)*b;P.z=F.z+(P.z-F.z)*b;P.r=F.r+(P.r-F.r)*b;P.phi=F.phi+(P.phi-F.phi)*b;P.th=F.th+d*b;}
  target.set(P.x,P.y,P.z);radius=P.r;phi=P.phi;theta=P.th;updCam();
  cineCap((storm?'🌪️ Tempête en simulation · ':'📷 ')+cine.shot.cap);
}
if(spectate){document.body.classList.add('lobby');S.speed=3;S.time=9.5;target.set(EX,0,-12);radius=260;phi=.9;theta=Math.PI/5;updCam();}
syncPeople();refreshHUD();animate();
if(spectate){window.CampingCloud.showLobby();cine.cap='';}
else if(window.CampingCloud&&window.CampingCloud.mode&&window.CampingCloud.mode()==='play')skyDrop();   // « Jouer » depuis le salon : on arrive directement du ciel
if(!spectate&&!localStorage.getItem(SAVE+'_tip'))toast('Bienvenue ! Relie chaque bâtiment à un chemin piéton (sinon il reste inactif). Recherches (🔬) pour débloquer la suite. G = grille 1 m, N = réseaux eau/électricité.');
}
